<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>キーシュベルへの50質問</title>
<style>
:root{--ink:#43372f;--muted:#88796d;--accent:#98765d;--paper:#fffdf9;--line:#eadfd4;--soft:#f5eee7}
*{box-sizing:border-box}body{margin:0;background:#f3eee8;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 44px}
.hero,.panel{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 8px 30px #4d35200b}
.hero img{width:100%;height:min(64vw,430px);object-fit:cover;object-position:center 48%;display:block}
.hero-copy{padding:22px 20px 20px;text-align:center;background:linear-gradient(180deg,#fbf5ee,#fffdf9)}
.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted);font-weight:700}
h1{font-size:clamp(25px,6vw,36px);margin:9px 0 7px;letter-spacing:.03em}
.subtitle{color:var(--muted);font-size:13px;line-height:1.8}
.pills{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:14px}
.pill{border:1px solid #e2d4c7;border-radius:99px;padding:5px 11px;font-size:12px;color:#715d4d;background:#fff}
.credit{margin-top:16px;font-size:12px;color:#9a8879}.credit b{color:#705844}
.panel{margin-top:16px;padding:20px}
.topline{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);font-weight:650}
.track{height:7px;background:#eee5dc;border-radius:20px;margin:12px 0 18px;overflow:hidden}.fill{height:100%;background:#a9876d;width:0;transition:width .2s}
.category{display:inline-block;background:#f3eae1;color:#81644e;border-radius:99px;padding:5px 11px;font-size:12px;margin-bottom:13px}
.question{font-size:21px;line-height:1.6;font-weight:750;margin:0 0 16px}
textarea{width:100%;min-height:160px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fffefa;color:var(--ink);font:inherit;font-size:15px;line-height:1.7;outline:none}
textarea:focus{border-color:#b4967c;box-shadow:0 0 0 3px #b4967c22}
.hint{font-size:12px;color:var(--muted);margin:10px 0 18px}
.buttons{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:12px;padding:12px 16px;font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.primary{background:#80644f;color:white;flex:1}.secondary{background:#f1e9e1;color:#6e5949}.quiet{background:transparent;color:var(--muted)}
.stats{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.review{white-space:pre-wrap;max-height:420px;overflow:auto;background:#faf6f1;border-radius:12px;padding:13px;font-size:13px;line-height:1.7}
footer{text-align:center;color:#9b8a7d;font-size:11px;padding:22px 5px}
@media(min-width:600px){.wrap{padding-top:30px}.panel{padding:26px}}
</style></head><body><main class="wrap">
